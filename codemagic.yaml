workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm ci
          npx cap sync ios
      - name: Build unsigned IPA (no Apple Developer account needed)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            archive -archivePath $CM_BUILD_DIR/HarshRun.xcarchive
          APP_PATH=$(find $CM_BUILD_DIR/HarshRun.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          mkdir -p $CM_BUILD_DIR/Payload
          cp -r "$APP_PATH" $CM_BUILD_DIR/Payload/
          cd $CM_BUILD_DIR && zip -r HarshRun-unsigned.ipa Payload
    artifacts:
      - HarshRun-unsigned.ipa
