workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm ci
          npx cap sync ios
      - name: Build unsigned IPA (no Apple Developer account needed)
        script: |
          set -e
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -target App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$CM_BUILD_DIR/build" \
            build
          APP_PATH="$CM_BUILD_DIR/build/App.app"
          if [ ! -d "$APP_PATH" ]; then echo "ERROR: App.app not found"; ls -la "$CM_BUILD_DIR/build"; exit 1; fi
          du -sh "$APP_PATH"
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -r "$APP_PATH" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR" && zip -r HarshRun-unsigned.ipa Payload
          ls -lh HarshRun-unsigned.ipa
    artifacts:
      - HarshRun-unsigned.ipa
