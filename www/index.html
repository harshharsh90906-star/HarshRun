<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Harsh Games</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #1d0b26 0%, #3d1030 45%, #7a1e3f 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    text-align: center;
  }
  h1 { font-size: 42px; letter-spacing: 1px; }
  h1 .heart { color: #ff4d6d; }
  p.sub { margin-top: 6px; font-size: 16px; opacity: .85; }
  .games { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 420px; margin-top: 32px; }
  a.card {
    display: flex; align-items: center; gap: 16px;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 20px; padding: 20px;
    color: #fff; text-decoration: none; text-align: left;
  }
  a.card:active { background: rgba(255,255,255,.20); }
  .icon { font-size: 44px; line-height: 1; }
  .card h2 { font-size: 22px; }
  .card p { font-size: 14px; opacity: .85; margin-top: 4px; line-height: 1.45; }
  .foot { margin-top: 36px; font-size: 13px; opacity: .7; }
</style>
</head>
<body>
  <h1>Harsh Games <span class="heart">❤️</span></h1>
  <p class="sub">Choose your game</p>
  <div class="games">
    <a class="card" href="harsh-run.html">
      <span class="icon">🏃</span>
      <span>
        <h2>Harsh Run</h2>
              </span>
    </a>
    <a class="card" href="heart-catch.html">
      <span class="icon">💕</span>
      <span>
        <h2>Heart Catch</h2>
              </span>
    </a>
    <a class="card" href="heart-pop.html">
      <span class="icon">🎈</span>
      <span>
        <h2>Heart Pop</h2>
              </span>
    </a>
    <a class="card" href="stack-hearts.html">
      <span class="icon">🗼</span>
      <span>
        <h2>Stack Hearts</h2>
              </span>
    </a>
    <a class="card" href="connect-stars.html">
      <span class="icon">✨</span>
      <span>
        <h2>Connect the Stars</h2>
              </span>
    </a>
  </div>
  <p class="foot">Made with love, for Ancy 💕</p>
</body>
</html>
